<!DOCTYPE html>
<!--
    Galactic Exoplanet Distribution

    This page renders an interactive 3D visualization of exoplanet positions in our
    galaxy using Three.js. It loads exoplanet coordinate data and displays them as
    colored points, then overlays a transparent Milky Way disk or volumetric galaxy
    representation to provide spatial context. Controls allow switching between
    galaxy modes, toggling discovery methods, and viewing update metadata.
-->
<html>

<head>
    <title>Galactic Exoplanet Distribution</title>
	<link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent body scrolling */
        }

        canvas {
            display: block;
        }

        #main-title {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            color: white;
            font-family: Arial, sans-serif;
            z-index: 10;
            border-radius: 8px;
            max-width: 400px; /* Limit width on larger screens */
        }

        #main-title h1 {
            margin: 0 0 10px 0;
            font-size: 2em;
        }

        #main-title p {
            margin: 0;
            font-size: 1.1em;
            line-height: 1.5;
        }

        /* Controls box - default for wider screens */
		#controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            color: white;
            font-family: Arial, sans-serif;
            border-radius: 8px;
            z-index: 11;
            max-width: 300px;
            word-wrap: break-word;
            max-height: calc(100vh - 20px);   /* fallback for older browsers */
            max-height: calc(100dvh - 20px);  /* accounts for mobile address-bar chrome */
            overflow-y: auto;
        }

        /* Collapsible content (always applies, but overridden by .collapsed) */
        #controls-content {
            max-height: 1000px; /* Large enough to show all content when expanded */
            overflow: hidden; /* Default to hidden to ensure it works with max-height */
            transition: max-height 0.3s ease-out; /* Smooth transition for expand/collapse */
        }

        /* This is the key: when 'collapsed' class is present, enforce zero height */
        #controls-content.collapsed {
            max-height: 0;
            overflow: hidden; /* Absolutely ensure content is hidden */
        }

        /* General control styling */
        #controls h3 {
            margin: 0 0 10px 0;
            cursor: pointer;
            display: flex;
            font-size: 2.0em;
            align-items: center;
        }

        .arrow {
            transition: transform 0.3s ease-out;
            font-size: 1.0em;
            margin-right: 10px;
        }

        .arrow.up {
            transform: rotate(180deg);
        }

        #methods-section,
        #galaxy-annotations-section,
        #galaxy-3d-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        #methods-section:first-child {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        #controls h4 {
            margin: 0 0 8px 0;
            font-size: 1.1em;
        }

        #controls ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #controls li {
            margin: 5px 0;
            min-height: 24px;
            display: flex;
            align-items: center;
        }

        #controls input[type="checkbox"] {
            margin-right: 5px;
            min-width: 16px;
            min-height: 16px;
        }

        #controls label {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            cursor: pointer;
            min-height: 24px;
            width: 100%;
        }

        #legend-list li:not(.all-method) {
            margin-left: 12px;
        }

        #toggle-3d-container {
            position: relative;
            top: auto;
            right: auto;
            background: none;
            padding: 0;
            color: white;
            font-family: Arial, sans-serif;
            border-radius: 0;
            z-index: auto;
            margin-top: 10px;
        }

        #loading-textures,
        #loading-mesh,
        #loading-cloud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 20px;
            font-family: Arial, sans-serif;
            font-size: 1.5em;
            border-radius: 6px;
            z-index: 40;
            display: none;
        }

        #update-date {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            color: white;
            font-family: Arial, sans-serif;
            border-radius: 6px;
            z-index: 5;
        }

        #source-link {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            color: white;
            font-family: Arial, sans-serif;
            border-radius: 6px;
            z-index: 5;
        }

        #source-link a {
            color: #58d68d;
            text-decoration: none;
        }

        #source-link a:hover {
            text-decoration: underline;
        }

        /* Portrait or mobile mode adjustments */
        @media (max-width: 768px), (orientation: portrait) {
            #main-title {
                position: fixed; /* Keep title visible when scrolling */
                top: 10px;
                left: 50%;
                transform: translateX(-50%); /* Center the title */
                width: calc(100% - 40px); /* Full width with padding */
                max-width: none; /* Remove max-width in portrait */
                text-align: center; /* Center text within title box */
                padding: 12px; /* Slightly less padding for compactness */
            }

            #main-title h1 {
                font-size: 2.0em;
                margin-bottom: 8px;
            }

            #main-title p {
                font-size: 1.8em;
            }

            #controls {
                position: fixed; /* Keep controls visible when scrolling */
                top: auto; /* Remove top constraint */
                bottom: 65px; /* Position at the bottom */
                left: 50%;
                transform: translateX(-50%); /* Center the controls */
                width: calc(100% - 40px); /* Full width with padding */
                max-width: none; /* Remove max-width in portrait */
                z-index: 15; /* Ensure controls are always on top in mobile */
                font-size: 2.5em; /* Increase overall font size in controls */
            }

            #controls input[type="checkbox"],
            #controls input[type="radio"] {
                min-width: 35px;
                min-height: 35px;
            }

            #controls label {
                min-height: 60px;
                gap: 25px;
            }

            /* For portrait, the expanded max-height can be more constrained */
            #controls-content:not(.collapsed) {
                max-height: 70vh; /* Adjust as needed, limits height when expanded in portrait */
                overflow-y: auto; /* Allow scrolling when expanded if content exceeds 70vh */
                padding-bottom: 20px; /* Add some padding at the bottom of the scrollable area */
            }

            #controls h3 {
                justify-content: center; /* Center the "Controls" title */
                margin-bottom: 10px; /* Add some space below the title in mobile */
                font-size: 2.8rem;
            }

            .arrow {
                font-size: 0.9em;
            }

            #update-date {
                font-size: 1.5em;
                padding: 10px 14px;
            }

            #source-link {
                font-size: 1.5em;
                font-weight: 600;
                padding: 10px 14px;
            }

			#update-date,
            #source-link {
                position: fixed;
            }

            /* Move loading messages to top on mobile */
            #loading-textures,
            #loading-mesh,
            #loading-cloud {
                position: fixed !important; /* Ensure fixed positioning on mobile */
                bottom: auto !important; /* Remove bottom positioning */
                top: 120px !important; /* Position below the title box */
                left: 50% !important;
                transform: translateX(-50%) !important;
                font-size: 2.0em; /* Slightly smaller on mobile */
                padding: 12px 20px;
                height: auto !important; /* Ensure box doesn't stretch */
                width: auto !important; /* Let content determine width */
            }
        }

    </style>
</head>

<body>
    <div id="main-title">
        <h1>Distribution of Exoplanets Discovered in Our Galaxy</h1>
        <p>An interactive visualization of exoplanets by detection method</p>
    </div>

    <div id="controls">
        <h3 id="controls-title"><span class="arrow">&#9660;</span> Controls</h3>
        <div id="controls-content">
            <div id="methods-section">
                <h4>Methods</h4>
                <ul id="legend-list">
                    <li class="all-method">
                        <label>
                            <input type="checkbox" id="all-checkbox" checked>
                            <span style="display: inline-block; width: 12px; height: 12px; background: #58d68d; margin-right: 5px;"></span>
                            All
                        </label>
                    </li>
                </ul>
            </div>

            <div id="galaxy-section">
                <h4>Galaxy</h4>
                <div>
                    <label>
                        <input type="radio" name="galaxy-mode" id="galaxy-2d" checked>
                        2D Illustration
                    </label>
                </div>
                <div>
                    <label>
                        <input type="radio" name="galaxy-mode" id="galaxy-2d-annotated">
                        2D Annotations
                    </label>
                </div>
                <div>
                    <label>
                        <input type="radio" name="galaxy-mode" id="galaxy-3d-extruded">
                        3D Extruded
                    </label>
                </div>
                <div>
                    <label>
                        <input type="radio" name="galaxy-mode" id="galaxy-3d-cloud">
                        3D Cloud (heavy!)
                    </label>
                </div>
                <div>
                    <label>
                        <input type="radio" name="galaxy-mode" id="galaxy-none">
                        No Galaxy
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-textures">Loading texture...</div>

    <div id="loading-mesh">Loading mesh...</div>

    <div id="loading-cloud">Loading cloud...</div>

    <div id="update-date">
        Last update: <span id="last-update">Loading...</span>
    </div>

    <div id="source-link">
        <a href="https://github.com/ferdesmello/exoplanets-in-the-galaxy-3d" target="_blank">Source code and more</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>

        // Declare these at the top of the script block
        let scene, camera, renderer, controls;
        let galaxyPlane = null;
        let galaxyHeightMesh = null;
        let galaxyHeightMeshMirror = null;
        let galaxyCloud = null; 
        let galaxyNebula = null;
        let galaxyHalo = null;
        let starfield = null;

        init();
        animate();

        //-------------------------------------------------------------------------------
        // Image cache for faster switching
        const imageCache = {};
        
        const preloadImages = [
            './images/MW_transparent_preview.png',
            './images/MW_transparent_annotated_preview.png',
            './images/MW_transparent_small.png',
            './images/MW_transparent_annotated_small.png'
        ];

        // Enhanced preloading with caching
        function preloadImagesWithCache() {
            preloadImages.forEach(src => {
                const img = new Image();
                img.onload = () => {
                    imageCache[src] = img;
                };
                img.src = src;
            });
        }

        // Call enhanced preloading
        preloadImagesWithCache();

        // Configuration
        const config = {
            galaxySize: 136000,
            pointSize: 100.0,
            rotationSpeed: 0.005
        };

        // Define colors for each method
        const methodColors = {
            "Transit": 0xe74c3c, // Red #e74c3c
            "Radial Velocity": 0x27ae60, // Green #27ae60
            "Microlensing": 0x3498db, // Blue #3498db
            "Imaging": 0xf39c12, // Orange #f39c12
            "Transit Timing Variations": 0x8e44ad, // Purple #8e44ad
            "Eclipse Timing Variations": 0x922b21, // Brown #922b21
            "Orbital Brightness Modulation": 0xaf601a, // Dark orange #af601a
            "Pulsar Timing": 0xfdfefe, // White #efdfefe
            "Astrometry": 0x1a5276, // Dark blue #1a5276
            "Pulsation Timing Variations": 0x0e6655, // Dark green #0e6655
            "Disk Kinematics": 0x616a6b, // Grey #616a6b
            "Sun": 0xf1c40f // Yellow #f1c40f
        };

        // Store points objects for each method
        const methodPoints = {};

        // Store original materials for each method
        const originalMaterials = {};

        // Make sure textureLoader is accessible globally or instantiated when needed.
        const textureLoader = new THREE.TextureLoader();

        //-------------------------------------------------------------------------------
        async function init() {
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            document.getElementById('all-checkbox')
                .addEventListener('change', toggleAllExoplanets);

            // Camera position
            camera.position.set(0, 50000, 50000);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.5;
            controls.minDistance = 50;
            controls.maxDistance = 500000;

            // Galaxy mode listeners
            const galaxyModeRadios = document.querySelectorAll('input[name="galaxy-mode"]');
            galaxyModeRadios.forEach(radio => {
                radio.addEventListener('change', handleGalaxyModeChange);
            });

            // Load data FIRST
            await loadExoplanets(); // Load and plot exoplanets

            // Scene decorations
            createStarfield(); // Add starfield background
            addGalacticNorthMarker(); // Add Galactic North marker
            createControls(); // This function creates the checkboxes based on methods

            // Initialize "All" checkbox state
            const allCheckbox = document.getElementById('all-checkbox');
            allCheckbox.checked = true; // Start with "All" checked
            toggleAllExoplanets({ target: allCheckbox }); // Force update

            // NOW force initial galaxy mode loading UI
            handleGalaxyModeChange({ target: { id: 'galaxy-2d' } });
        }

        //-------------------------------------------------------------------------------
        function createStarfield() {
            const starCount = 5000;
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);
            
            // Generate random points on the inside of a large sphere
            const radius = 500000; // Large sphere radius
            
            for (let i = 0; i < starCount; i++) {
                // Random spherical coordinates
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                // Convert to Cartesian coordinates
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                starPositions[i * 3] = x;
                starPositions[i * 3 + 1] = y;
                starPositions[i * 3 + 2] = z;
            }
            
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1000,
                transparent: true,
                opacity: 0.8
            });
            
            starfield = new THREE.Points(starGeometry, starMaterial);
            starfield.renderOrder = -1; // Render behind everything else
            scene.add(starfield);
        }

        //-------------------------------------------------------------------------------
        function addGalacticNorthMarker() {
            // Create canvas and draw the "N"
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 512;

            // Draw the letter "N"
            context.fillStyle = 'white';
            context.font = 'bold 100px Arial';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText('N', canvas.width / 2, canvas.height / 2);

            // Create a texture from the canvas
            const texture = new THREE.CanvasTexture(canvas);

            const spriteMaterial = new THREE.SpriteMaterial({
                map: texture,
                transparent: true,
                depthWrite: false, // Optional: prevents it from cutting background
                blending: THREE.NormalBlending // Or AdditiveBlending if preferred
            });

            const sprite = new THREE.Sprite(spriteMaterial);

            sprite.scale.set(6000, 6000, 1); // Adjust size of the "N"
            sprite.position.set(0, 30000, 0); // Position at Galactic North

            sprite.renderOrder = 0; // Renders after the meshes
            scene.add(sprite);
        }

        //-------------------------------------------------------------------------------
        async function loadExoplanets() {
            try {
                const response = await fetch('./data/exoplanets_coordinates_methods.json');
                const data = await response.json();

                // Group data by method
                const groupedData = {};
                data.forEach((exoplanet) => {
                    const method = exoplanet[3]; // Fourth column is the method
                    if (!groupedData[method]) {
                        groupedData[method] = [];
                    }
                    groupedData[method].push(exoplanet);
                });

                // Create spheres for each method
                for (const [method, points] of Object.entries(groupedData)) {
                    const geometry = new THREE.BufferGeometry();
                    const vertices = [];

                    points.forEach((exoplanet) => {
                        vertices.push(exoplanet[0], exoplanet[2], -exoplanet[1]);
                    });

                    const verticesArray = new Float32Array(vertices);
                    geometry.setAttribute('position', new THREE.BufferAttribute(verticesArray, 3));

                    const circularTexture = createCircularTexture();

                    const material = new THREE.PointsMaterial({
                        color: methodColors[method],
                        size: 75, // Adjust point size
                        alphaMap: circularTexture, // Apply texture
                        transparent: true, // Keep background transparent
                        alphaTest: 0.5, // Avoid rendering square edges
                    });

                    const pointCloud = new THREE.Points(geometry, material);
                    pointCloud.renderOrder = 1; // Ensure points are rendered before the galaxy plane
                    scene.add(pointCloud);

                    // Store for toggling
                    methodPoints[method] = pointCloud;
                }
            } catch (error) {
                console.error('Error loading exoplanet data:', error);
                // Fallback: create a small sample of realistic data near the center (representing our local area)
                const fallbackData = [];
                for (let i = 0; i < 100; i++) {
                    // Create points clustered around the center with some randomness
                    const angle = Math.random() * Math.PI * 2;
                    const distance = Math.random() * 5000 + 1000; // 1000-6000 units from center
                    const x = Math.cos(angle) * distance;
                    const y = Math.sin(angle) * distance;
                    const z = (Math.random() - 0.5) * 1000; // Small z variation
                    
                    const methods = Object.keys(methodColors);
                    const randomMethod = methods[Math.floor(Math.random() * methods.length)];
                    
                    fallbackData.push([x, y, z, randomMethod]);
                }
                
                // Process fallback data the same way
                const groupedData = {};
                fallbackData.forEach((exoplanet) => {
                    const method = exoplanet[3];
                    if (!groupedData[method]) {
                        groupedData[method] = [];
                    }
                    groupedData[method].push(exoplanet);
                });

                for (const [method, points] of Object.entries(groupedData)) {
                    const geometry = new THREE.BufferGeometry();
                    const vertices = [];

                    points.forEach((exoplanet) => {
                        vertices.push(exoplanet[0], exoplanet[2], -exoplanet[1]);
                    });

                    const verticesArray = new Float32Array(vertices);
                    geometry.setAttribute('position', new THREE.BufferAttribute(verticesArray, 3));

                    const circularTexture = createCircularTexture();

                    const exoplanetMaterial = new THREE.PointsMaterial({
                        color: methodColors[method],
                        size: 150,
                        alphaMap: circularTexture,
                        transparent: true,
                        alphaTest: 0.5,
                    });

                    const pointCloud = new THREE.Points(geometry, exoplanetMaterial);
                    scene.add(pointCloud);

                    methodPoints[method] = pointCloud;
                }
            }
        }

        //-------------------------------------------------------------------------------
        function createGalaxyPlane(showAnnotations = false, onDone = null) {
            const loadingMsg = document.getElementById('loading-textures');

            const previewPath = showAnnotations
                ? './images/MW_transparent_annotated_preview.png'
                : './images/MW_transparent_preview.png';

            const highResPath = showAnnotations
                ? './images/MW_transparent_annotated_small.png'
                : './images/MW_transparent_small.png';

            const textureLoader = new THREE.TextureLoader();

            // Function to create or update galaxy plane with texture
            function updateGalaxyPlaneTexture(texture) {
                if (galaxyPlane) {
                    // Dispose old texture to prevent memory leaks
                    if (galaxyPlane.material.map) {
                        galaxyPlane.material.map.dispose();
                    }
                    galaxyPlane.material.map = texture;
                    galaxyPlane.material.needsUpdate = true;
                    galaxyPlane.material.transparent = true;
                    galaxyPlane.material.opacity = 1.0;
                    galaxyPlane.material.depthTest = true;
                    galaxyPlane.material.depthWrite = false;
                    galaxyPlane.renderOrder = 2; // Render after exoplanets

                } else {
                    // Create new galaxy plane
                    const geometry = new THREE.PlaneGeometry(config.galaxySize, config.galaxySize);
                    const material = new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        opacity: 1.0,
						depthTest: true,
                        depthWrite: true,
                        side: THREE.DoubleSide
                    });
                    galaxyPlane = new THREE.Mesh(geometry, material);
                    galaxyPlane.rotation.x = -Math.PI / 2;
                    scene.add(galaxyPlane);
                }
            }

            // Load low-res preview first (always show preview and loading)
            textureLoader.load(previewPath, (previewTexture) => {
                updateGalaxyPlaneTexture(previewTexture);
                
                // Now load the full-resolution texture
                textureLoader.load(highResPath, (hiResTexture) => {
                    updateGalaxyPlaneTexture(hiResTexture);
                    
                    if (onDone) onDone();
                });
            }, undefined, (error) => {
                console.error('Error loading preview texture:', error);
            });
        }

        //-------------------------------------------------------------------------------
        function createGalaxyHeightMesh(onDone = null) {
            const textureLoader = new THREE.TextureLoader();
            const loadingMeshMsg = document.getElementById('loading-mesh');

            // Load BOTH images
            const colorTexture = textureLoader.load('./images/MW_transparent_small.png');
            const heightTexture = textureLoader.load('./images/MW_transparent_small_BW.png', (texture) => {
                const widthSegments = 512;
                const heightSegments = 512;

                const geometry = new THREE.PlaneGeometry(
                    config.galaxySize, config.galaxySize,
                    widthSegments, heightSegments
                );

                // Extract pixel data from height map
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = texture.image;
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
                const positions = geometry.attributes.position;

                for (let i = 0; i < positions.count; i++) {
                    const ix = i % (widthSegments + 1);
                    const iy = Math.floor(i / (widthSegments + 1));

                    const pixelX = Math.floor(ix / widthSegments * (img.width - 1));
                    const pixelY = Math.floor(iy / heightSegments * (img.height - 1));
                    const index = (pixelY * img.width + pixelX) * 4;

                    const brightness = imgData[index] / 255; // Red channel
                    const height = (brightness - 0.5) * 8000; // Centered extrusion up/down

                    positions.setZ(i, height);
                }
                positions.needsUpdate = true;

                const meshMaterial = new THREE.MeshBasicMaterial({
                    map: colorTexture, // COLOR image
                    transparent: true,
                    opacity: 1,
                    side: THREE.DoubleSide,
                    depthWrite: false, // Prevents the galaxy plane from affecting depth buffer
                });

                galaxyHeightMesh = new THREE.Mesh(geometry, meshMaterial);
                galaxyHeightMesh.rotation.x = -Math.PI / 2;
                galaxyHeightMesh.renderOrder = 3;
                scene.add(galaxyHeightMesh);

                if (onDone) onDone();

                }, undefined, (error) => {
                    // Hide loading message on error
                    console.error('Error loading height texture:', error);
            });
        }

        //-------------------------------------------------------------------------------
        async function createUnifiedCloudGalaxy() {
            const loadingCloudMsg = document.getElementById('loading-cloud');
            const textureLoader = new THREE.TextureLoader();
            
            // 1. LOAD TEXTURES
            const cloudTexture = await textureLoader.loadAsync('./images/MW_transparent_small.png');
            const nebulaTexture = await textureLoader.loadAsync('./images/MW_nebula_mask_small.png');
            const sprite = textureLoader.load('./images/fuzzy_circle.png');

            const isMobile = window.matchMedia("(pointer: coarse)").matches;

            const starCount = isMobile ? 50000 : 150000;
            const nebulaCount = isMobile ? 5000: 10000;
            const totalCount = starCount + nebulaCount;

            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(totalCount * 3);
            const colors = new Float32Array(totalCount * 3);
            const blendTypes = new Float32Array(totalCount);

            function getImageData(img) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);
                return ctx.getImageData(0, 0, img.width, img.height).data;
            }

            const cloudData = getImageData(cloudTexture.image);
            const nebulaData = getImageData(nebulaTexture.image);

            let idx = 0;

            // --- GENERATE STARS ---
            let s = 0;
            while (s < starCount) {
                let rx = Math.random() * cloudTexture.image.width;
                let ry = Math.random() * cloudTexture.image.height;
                let pixelIndex = (Math.floor(ry) * cloudTexture.image.width + Math.floor(rx)) * 4;
                let brightness = (cloudData[pixelIndex] + cloudData[pixelIndex+1] + cloudData[pixelIndex+2]) / 765;

                if (Math.random() < Math.pow(brightness, 6.0)) {
                    let posX = (rx / cloudTexture.image.width - 0.5) * config.galaxySize;
                    let posZ = (ry / cloudTexture.image.height - 0.5) * config.galaxySize;
                    
                    let distFromCenter = Math.sqrt(posX*posX + posZ*posZ);
                    let thickness = Math.max(200, 4000 * Math.exp(-distFromCenter / (config.galaxySize / 5)));
                    
                    let u1 = Math.random(), u2 = Math.random();
                    let posY = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2) * (thickness / 2);

                    positions[idx * 3] = posX;
                    positions[idx * 3 + 1] = posY;
                    positions[idx * 3 + 2] = posZ;

                    colors[idx * 3] = cloudData[pixelIndex] / 255;
                    colors[idx * 3 + 1] = cloudData[pixelIndex + 1] / 255;
                    colors[idx * 3 + 2] = cloudData[pixelIndex + 2] / 255;
                    blendTypes[idx] = 0.0; 
                    idx++; s++;
                }
            }

            // --- GENERATE NEBULA ---
            let n = 0;
            while (n < nebulaCount) {
                let rx = Math.random() * nebulaTexture.image.width;
                let ry = Math.random() * nebulaTexture.image.height;
                let pixelIndex = (Math.floor(ry) * nebulaTexture.image.width + Math.floor(rx)) * 4;
                let density = nebulaData[pixelIndex] / 255;

                if (Math.random() < Math.pow(density, 2)) {
                    let posX = (rx / nebulaTexture.image.width - 0.5) * config.galaxySize;
                    let posZ = (ry / nebulaTexture.image.height - 0.5) * config.galaxySize;
                    
                    let distFromCenter = Math.sqrt(posX*posX + posZ*posZ);
                    let thickness = 200 * Math.exp(-distFromCenter / (config.galaxySize / 4));
                    
                    let u1 = Math.random(), u2 = Math.random();
                    let posY = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2) * (thickness / 2);

                    positions[idx * 3] = posX;
                    positions[idx * 3 + 1] = posY;
                    positions[idx * 3 + 2] = posZ;

                    colors[idx * 3] = 0.15;      // Red channel
                    colors[idx * 3 + 1] = 0.01;  // Green channel
                    colors[idx * 3 + 2] = 0.005; // Blue channel
                    blendTypes[idx] = 1.0; 
                    idx++; n++;
                }
            }

            // Shuffle the indices so stars and dust are interleaved
            const indices = Array.from({ length: totalCount }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }

            const shuffledPos = new Float32Array(totalCount * 3);
            const shuffledCol = new Float32Array(totalCount * 3);
            const shuffledBlend = new Float32Array(totalCount);

            for (let i = 0; i < totalCount; i++) {
                const oldIdx = indices[i];
                shuffledPos.set([positions[oldIdx*3], positions[oldIdx*3+1], positions[oldIdx*3+2]], i*3);
                shuffledCol.set([colors[oldIdx*3], colors[oldIdx*3+1], colors[oldIdx*3+2]], i*3);
                shuffledBlend[i] = blendTypes[oldIdx];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(shuffledPos, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(shuffledCol, 3));
            geometry.setAttribute('blendType', new THREE.BufferAttribute(shuffledBlend, 1));

            const unifiedMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    pointTexture: { value: sprite },
                    dustOpacity: { value: isMobile ? 0.3 : 0.2 },

                    starSize: { value: isMobile ? 600.0 : 300.0 },
                    dustSize: { value: isMobile ? 900.0 : 500.0 },

                    starAlphaBoost: { value: isMobile ? 2.0 : 1.0 },
                    dustAlphaBoost: { value: isMobile ? 1.6 : 1.0 },

                    pixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
                },
                vertexShader: `
                    uniform float pixelRatio;
                    uniform float starSize;
                    uniform float dustSize;

                    attribute float blendType;
                    attribute vec3 color;

                    varying vec3 vColor;
                    varying float vBlend;

                    void main() {
                        vColor = color;
                        vBlend = blendType;

                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);

                        float sizeScale = (vBlend > 0.5) ? dustSize : starSize;
                        float size = sizeScale * pixelRatio * (1000.0 / length(mvPosition.xyz));

                        gl_PointSize = clamp(size, 1.0, 64.0);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D pointTexture;
                    uniform float dustOpacity;
                    uniform float starAlphaBoost;
                    uniform float dustAlphaBoost;

                    varying vec3 vColor;
                    varying float vBlend;

                    void main() {
                        vec4 tex = texture2D(pointTexture, gl_PointCoord);
                        if (tex.a < 0.01) discard;

                        if (vBlend < 0.5) {
                            float a = tex.a * 0.1 * starAlphaBoost;
                            vec3 col = vColor * 1.5 * a;
                            gl_FragColor = vec4(col, a);
                        } else {
                            float a = tex.a * dustOpacity * dustAlphaBoost;
                            vec3 col = vColor * 0.5 * a;
                            gl_FragColor = vec4(col, a);
                        }
                    }
                `,
                transparent: true,
                depthWrite: false,
                depthTest: true,
                blending: THREE.CustomBlending,
                blendEquation: THREE.AddEquation,
                blendSrc: THREE.OneFactor,
                blendDst: THREE.OneMinusSrcAlphaFactor
            });

            galaxyCloud = new THREE.Points(geometry, unifiedMaterial);
            galaxyCloud.userData.isVolumetric = true;
            
            galaxyCloud.renderOrder = 10; 
            
            scene.add(galaxyCloud);
            
            //hideAllLoadingMessages();
        }
        
        //-------------------------------------------------------------------------------
        function createGalacticHalo() {
            // Create a volumetric ellipsoidal halo using particles
            const haloParticleCount = 10000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(haloParticleCount * 3);
            const colors = new Float32Array(haloParticleCount * 3);
            const alphas = new Float32Array(haloParticleCount);

            // Halo dimensions (ellipsoidal - "fat hamburger")
            const haloRadiusXZ = config.galaxySize * 0.9; // Wider in X and Z
            const haloRadiusY = config.galaxySize * 0.4;  // Flatter in Y (height)

            for (let i = 0; i < haloParticleCount; i++) {
                // Generate points using spherical coordinates, then scale to ellipsoid
                const theta = Math.random() * Math.PI * 2; // azimuthal angle
                const phi = Math.acos(2 * Math.random() - 1); // polar angle (uniform on sphere)
                
                // Distance from center (biased toward outer regions for halo effect)
                const u = Math.random();
                const r = Math.pow(u, 0.4); // Power < 1 concentrates points outward
                
                // Convert to Cartesian, then scale to ellipsoid
                const x = r * Math.sin(phi) * Math.cos(theta) * haloRadiusXZ;
                const y = r * Math.cos(phi) * haloRadiusY;
                const z = r * Math.sin(phi) * Math.sin(theta) * haloRadiusXZ;
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Warm yellowish-orange color (old stars in halo)
                colors[i * 3] = 1.0;      // R
                colors[i * 3 + 1] = 0.85; // G
                colors[i * 3 + 2] = 0.6;  // B

                // Alpha based on distance from center (more transparent toward edges)
                const distFromCenter = Math.sqrt(x*x + y*y + z*z);
                const maxDist = Math.sqrt(haloRadiusXZ*haloRadiusXZ + haloRadiusY*haloRadiusY);
                alphas[i] = 1.0 - (distFromCenter / maxDist); // Fade toward edges
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('customAlpha', new THREE.BufferAttribute(alphas, 1));

            const sprite = new THREE.TextureLoader().load('./images/fuzzy_circle.png');

            const haloMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    pointTexture: { value: sprite },
                    baseOpacity: { value: 0.004 }, // Very subtle
                    pixelRatio: { value: Math.min(window.devicePixelRatio, 2) }
                },
                vertexShader: `
                    uniform float pixelRatio;
                    attribute vec3 color;
                    attribute float customAlpha;
                    varying vec3 vColor;
                    varying float vAlpha;
                    
                    void main() {
                        vColor = color;
                        vAlpha = customAlpha;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = 10000.0 * pixelRatio *(1000.0 / length(mvPosition.xyz));
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D pointTexture;
                    uniform float baseOpacity;
                    varying vec3 vColor;
                    varying float vAlpha;

                    void main() {
                        vec4 tex = texture2D(pointTexture, gl_PointCoord);
                        if (tex.a < 0.01) discard;
                        
                        float finalAlpha = tex.a * vAlpha * baseOpacity;
                        vec3 premultColor = vColor * finalAlpha;
                        gl_FragColor = vec4(premultColor, finalAlpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                depthTest: true,
                blending: THREE.CustomBlending,
                blendEquation: THREE.AddEquation,
                blendSrc: THREE.OneFactor,
                blendDst: THREE.OneMinusSrcAlphaFactor
            });

            const halo = new THREE.Points(geometry, haloMaterial);
            halo.renderOrder = 9; // Render after disk but before exoplanets
            scene.add(halo);
            
            return halo;
        }

        //-------------------------------------------------------------------------------
        function toggleGalaxyMode(event) {
            const is3D = event.target.checked;

            if (is3D) {
                // Remove 2D plane if exists
                if (galaxyPlane) {
                    scene.remove(galaxyPlane);
                    galaxyPlane = null;
                }
                // Add 3D meshes
                createGalaxyHeightMesh();
            } else {
                // Remove 3D meshes if exist
                if (galaxyHeightMesh) {
                    scene.remove(galaxyHeightMesh);
                    scene.remove(galaxyHeightMeshMirror);
                    galaxyHeightMesh = null;
                    galaxyHeightMeshMirror = null;
                }
                // Add 2D plane back
                createGalaxyPlane();
            }
        }

        //-------------------------------------------------------------------------------
        function handleGalaxyModeChange(event) {
            const selectedMode = event.target.id;
            
            // Always reset messages first
            hideAllLoadingMessages();

            // Remove all existing galaxy objects
            if (galaxyPlane) {
                scene.remove(galaxyPlane);
                galaxyPlane = null;
            }
            if (galaxyHeightMesh) {
                scene.remove(galaxyHeightMesh);
                scene.remove(galaxyHeightMeshMirror);
                galaxyHeightMesh = null;
                galaxyHeightMeshMirror = null;
            }
            // ADD THIS: Clean up the volumetric points
            if (galaxyCloud) {
                scene.remove(galaxyCloud);
                galaxyCloud = null;
            }
            // CLEANUP: Remove the nebula if it exists
            if (galaxyNebula) {
                scene.remove(galaxyNebula);
                galaxyNebula = null;
            }
            // CLEANUP: Remove the halo if it exists
            if (galaxyHalo) {
                scene.remove(galaxyHalo);
                galaxyHalo = null;
            }

            // Create appropriate galaxy based on selection
            switch (selectedMode) {
                case 'galaxy-2d':
                    if (starfield) starfield.visible = true;
                    showLoading('loading-textures');

                    createGalaxyPlane(false, () => {
                        hideAllLoadingMessages();
                    });
                    break;

                case 'galaxy-2d-annotated':
                    if (starfield) starfield.visible = true;
                    showLoading('loading-textures');

                    createGalaxyPlane(true, () => {
                        hideAllLoadingMessages();
                    });
                    break;

                case 'galaxy-3d-extruded':
                    if (starfield) starfield.visible = true;
                    showLoading('loading-mesh');
                    createGalaxyHeightMesh(() => {
                        hideAllLoadingMessages();
                    });
                    break;

                case 'galaxy-3d-cloud':
                    if (starfield) starfield.visible = true;
                    showLoading('loading-cloud');
                    createGalaxyPlane(false);
                    createUnifiedCloudGalaxy()
                        .then(() => {
                            hideAllLoadingMessages();
                        })
                        .catch(err => console.error(err));
                    galaxyHalo = createGalacticHalo();
                    break;

                case 'galaxy-none':
                    if (starfield) starfield.visible = false;
                    // Do nothing - no galaxy displayed
                    break;
            }
        }

        //-------------------------------------------------------------------------------
        function createControls() {
            const legendList = document.getElementById('legend-list');

            for (const [method, color] of Object.entries(methodColors)) {
                const listItem = document.createElement('li');
                listItem.innerHTML = `
                        <label>
                            <input type="checkbox" class="method-checkbox" checked data-method="${method}">
                            <span style="display: inline-block; width: 12px; height: 12px; background: #${color.toString(16).padStart(6, '0')}; margin-right: 5px;"></span>
                            ${method}
                        </label>
                    `;
                legendList.appendChild(listItem);

                const checkbox = listItem.querySelector('input');
                checkbox.addEventListener('change', (event) => {
                    const method = event.target.dataset.method;
                    if (methodPoints[method]) {
                        methodPoints[method].visible = event.target.checked;
                    }
                });
            }
        }

        //-------------------------------------------------------------------------------
        function toggleAllExoplanets(event) {
            const allChecked = event.target.checked;
            const methodCheckboxes = document.querySelectorAll('.method-checkbox');

            for (const [method, pointCloud] of Object.entries(methodPoints)) {
                if (allChecked) {
                    pointCloud.material.color.set(0x58d68d); // Set all points to green
                    pointCloud.visible = true;
                } else {
                    pointCloud.material.color.set(methodColors[method]); // Restore original color
                    pointCloud.visible = document.querySelector(`.method-checkbox[data-method="${method}"]`).checked;
                }
            }

            // Enable/disable method checkboxes
            methodCheckboxes.forEach((checkbox) => {
                checkbox.disabled = allChecked;
            });
        }

        //-------------------------------------------------------------------------------
        function hideAllLoadingMessages() {
            document.getElementById('loading-textures').style.display = 'none';
            document.getElementById('loading-mesh').style.display = 'none';
            document.getElementById('loading-cloud').style.display = 'none';
        }

        //------------------------------------------------------------------------------- 
        function showLoading(id) {
            hideAllLoadingMessages();
            document.getElementById(id).style.display = 'block';
        }

        //-------------------------------------------------------------------------------
        function createCircularTexture() {
            const size = 256; // Texture resolution
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, size / 2, 0, 2 * Math.PI);
            ctx.fillStyle = '#ffffff'; // White circle
            ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        //-------------------------------------------------------------------------------
        // To sort particles from back to front, we need to calculate their depth relative to the camera each frame and reorder them accordingly.
        function sortParticles(points) {
            const geometry = points.geometry;
            const positions = geometry.attributes.position.array;
            const colors = geometry.attributes.color.array;
            const blendTypes = geometry.attributes.blendType.array;
            const count = geometry.attributes.position.count;

            const depthArray = [];
            const projScreenMatrix = new THREE.Matrix4();
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

            for (let i = 0; i < count; i++) {
                const x = positions[i * 3];
                const y = positions[i * 3 + 1];
                const z = positions[i * 3 + 2];
                
                // Calculate camera distance (Z-depth)
                const dz = (x * projScreenMatrix.elements[2] + y * projScreenMatrix.elements[6] + z * projScreenMatrix.elements[10] + projScreenMatrix.elements[14]) /
                        (x * projScreenMatrix.elements[3] + y * projScreenMatrix.elements[7] + z * projScreenMatrix.elements[11] + projScreenMatrix.elements[15]);
                
                depthArray.push({ index: i, depth: dz });
            }

            // Sort from back to front
            depthArray.sort((a, b) => b.depth - a.depth);

            const sortedPos = new Float32Array(positions.length);
            const sortedCol = new Float32Array(colors.length);
            const sortedBlend = new Float32Array(blendTypes.length);

            for (let i = 0; i < count; i++) {
                const oldIdx = depthArray[i].index;
                sortedPos.set([positions[oldIdx*3], positions[oldIdx*3+1], positions[oldIdx*3+2]], i*3);
                sortedCol.set([colors[oldIdx*3], colors[oldIdx*3+1], colors[oldIdx*3+2]], i*3);
                sortedBlend[i] = blendTypes[oldIdx];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(sortedPos, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(sortedCol, 3));
            geometry.setAttribute('blendType', new THREE.BufferAttribute(sortedBlend, 1));
        }

        //-------------------------------------------------------------------------------
        // Update your existing animate() function
        function animate() {
            requestAnimationFrame(animate);

            // Only update controls if they have been initialized
            if (controls) {
                controls.update();
            }

            // Only sort particles if galaxyCloud and geometry are fully ready
            if (galaxyCloud && galaxyCloud.geometry && galaxyCloud.userData.isVolumetric) {
                // Performance check: sort every 10 frames to avoid lag
                if (renderer && renderer.info.render.frame % 10 === 0) {
                    sortParticles(galaxyCloud);
                }
            }

            // Only render if the core components are ready
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        } 

        //-------------------------------------------------------------------------------
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

            const dpr = Math.min(window.devicePixelRatio, 2);

            if (galaxyCloud) {
                galaxyCloud.material.uniforms.pixelRatio.value = dpr;
            }
            if (galaxyHalo) {
                galaxyHalo.material.uniforms.pixelRatio.value = dpr;
            }
        });
    </script>

    <script>
        // Collapsible controls logic
        document.addEventListener('DOMContentLoaded', () => {
            const controlsTitle = document.getElementById('controls-title');
            const controlsContent = document.getElementById('controls-content');

            // **ALWAYS** start the controls content in a collapsed state
            controlsContent.classList.add('collapsed');
            controlsTitle.querySelector('.arrow').classList.add('up'); // Ensure arrow points up

            // Add event listener for the click to toggle
            controlsTitle.addEventListener('click', () => {
                controlsContent.classList.toggle('collapsed');
                controlsTitle.querySelector('.arrow').classList.toggle('up');
            });
        });

        // Last update logic
        fetch('./data/last_update.txt')
            .then(response => response.text())
            .then(text => {
                const match = text.match(/LAST_UPDATE=(.*)/);
                if (match) {
                    const dateString = match[1];
                    const [year, month, day] = dateString.split('-').map(Number);
                    const dateObj = new Date(year, month - 1, day); // month is 0-based
                    const formattedDate = dateObj.toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                    document.getElementById('last-update').textContent = formattedDate;
                } else {
                    document.getElementById('last-update').textContent = 'Unknown';
                }
            })
            .catch(() => {
                document.getElementById('last-update').textContent = 'Unavailable';
            });
    </script>
